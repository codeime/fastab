name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      # --check is the same freshness gate as a full sync + git diff, without
      # rewriting bundle/specs or preflight-compiling gitignored specs-ir.
      # A later step compiles IR once for audit / spec-pair / engine tests.
      - name: Verify bundled specs source
        run: |
          git ls-files --error-unmatch bundle/specs/.source-manifest.json >/dev/null
          node scripts/sync-bundled-specs.mjs --check

      - name: Test spec IR compiler
        run: |
          node --check scripts/build-spec-inputs.mjs
          node --check scripts/publish-app-bundle.mjs
          bash -n scripts/build-app.sh
          bash -n scripts/assert-no-runtime-js.sh
          node --test --test-concurrency=1 scripts/compile-spec-ir.test.mjs scripts/audit-spec-hooks.test.mjs scripts/compiler-hook-chain.test.mjs scripts/spec-pair.test.mjs scripts/sync-bundled-specs.test.mjs scripts/typed-hook-ir.test.mjs scripts/build-spec-inputs.test.mjs scripts/publish-app-bundle.test.mjs

      - name: Compile and audit bundled spec IR
        run: |
          set -o pipefail
          log="$(mktemp)"
          # A child shell keeps errexit: inside a `||` list bash ignores it.
          bash -eux -c '
            node scripts/compile-spec-ir.mjs
            node scripts/audit-spec-hooks.mjs
            node scripts/spec-pair.mjs
            node scripts/capture-typed-trigger-reference.mjs --check
            node scripts/capture-typed-trigger-reference.mjs --get-query-term --check
            node scripts/capture-typed-reference.mjs --field getQueryTerm --check
            node scripts/capture-typed-reference.mjs --field postProcess --check
            node scripts/capture-typed-reference.mjs --field script --check
            node scripts/capture-typed-reference.mjs --field filterTemplateSuggestions --check
            ./scripts/assert-no-runtime-js.sh
          ' 2>&1 | tee "$log" || {
            # Logs need a GitHub login; annotations do not.
            python3 scripts/annotate-ci-failure.py tail "$log" 60 || true
            exit 1
          }

      - name: Verify native hook inventory
        run: node scripts/classify-native-hooks.mjs --check

      - name: Assert path-switch gate
        run: |
          node -e '
            const expected = process.env.EC_GATE_PATH_SWITCH_EXPECTED;
            const inventory = require("./crates/fastab_engine/testdata/native-hooks/inventory.json");
            const allowed = inventory.gate && inventory.gate.pathSwitchAllowed === true;
            if (expected === "false") {
              if (allowed) {
                console.error("EC_GATE_PATH_SWITCH_EXPECTED=false but gate.pathSwitchAllowed is true");
                process.exit(1);
              }
              process.exit(0);
            }
            if (!allowed) {
              console.error("T3.4 requires inventory.json gate.pathSwitchAllowed === true");
              process.exit(1);
            }
          '

      - name: Test hook output baselines
        run: node --test --test-concurrency=1 scripts/hook-baseline-contract.test.mjs scripts/capture-hook-baseline.test.mjs scripts/record-cli-output.test.mjs

      - name: Verify CLI output samples
        run: node scripts/record-cli-output.mjs --check

      - name: Verify hook output baselines
        run: node scripts/capture-hook-baseline.mjs --check

      - name: Test native inventory and test-only source reference
        run: node --test --test-concurrency=1 scripts/native-hook-adapters.test.mjs scripts/classify-native-hooks.test.mjs scripts/reference-audit-worker.test.mjs scripts/capture-hook-reference.test.mjs scripts/capture-hook-reference-batch.test.mjs scripts/capture-typed-trigger-reference.test.mjs

      - name: Build packages
        run: pnpm build

      - name: Lint packages
        run: pnpm lint

      - name: Test packages
        run: pnpm test:ci

      - name: Install website dependencies
        env:
          HUSKY: 0
        run: pnpm -C website install --frozen-lockfile

      - name: Build website
        run: pnpm -C website build

  # A measurement, not a gate: per-crate attribution of the shipped binaries,
  # so size work starts from numbers. Its own runner and cache keep it off the
  # Rust job's clock; the crate tables land in annotations and the summary.
  binary-size:
    name: Binary size
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install protobuf

      - name: Set up Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: binary-size

      - name: Install cargo-bloat
        run: cargo install cargo-bloat --locked

      - name: Measure shipped binaries
        run: ./scripts/binary-size-report.sh

  rust:
    name: Rust
    # Same image as release.yml. From 2026-11-02 macos-15 arm64 jobs sat in
    # the queue until GitHub cancelled them unstarted, five runs in a row.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Record build identity
        run: |
          echo "AMAZON_Q_BUILD_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "AMAZON_Q_BUILD_DATETIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "AMAZON_Q_BUILD_TARGET_TRIPLE=aarch64-apple-darwin" >> "$GITHUB_ENV"
          echo "FASTAB_BUILD_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install fish protobuf shellcheck

      - name: Set up Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci

      - name: Check formatting
        run: cargo fmt --check

      - name: Test atomic app bundle swap helper
        run: |
          swap_root="$(mktemp -d "$RUNNER_TEMP/easy-complete-atomic-swap.XXXXXX")"
          mkdir "$swap_root/left" "$swap_root/right"
          touch "$swap_root/left/from-left" "$swap_root/right/from-right"
          /usr/bin/xcrun clang -Os -Wall -Wextra -Werror -mmacosx-version-min=12.0 scripts/atomic-swap-darwin.c -o "$swap_root/atomic-swap-darwin"
          "$swap_root/atomic-swap-darwin" swap "$swap_root/left" "$swap_root/right"
          test -f "$swap_root/left/from-right"
          test -f "$swap_root/right/from-left"
          test ! -e "$swap_root/left/from-left"
          test ! -e "$swap_root/right/from-right"
          mkdir "$swap_root/exclusive-source"
          touch "$swap_root/exclusive-source/published"
          "$swap_root/atomic-swap-darwin" exclusive "$swap_root/exclusive-source" "$swap_root/exclusive-final"
          test -f "$swap_root/exclusive-final/published"
          mkdir "$swap_root/exclusive-collision"
          mkdir "$swap_root/exclusive-existing"
          if "$swap_root/atomic-swap-darwin" exclusive "$swap_root/exclusive-collision" "$swap_root/exclusive-existing"; then
            echo "RENAME_EXCL unexpectedly replaced an existing directory" >&2
            exit 1
          fi
          test -d "$swap_root/exclusive-collision"
          test -d "$swap_root/exclusive-existing"

      # Job logs need a GitHub login; a failure also posts the lints as an
      # annotation, which the public API serves (as for fterm footprint).
      - name: Clippy
        run: |
          set -o pipefail
          mkdir -p target
          if cargo clippy --locked --workspace --features fastab_cli/engine-cli --exclude fastab_desktop-fuzz --exclude fastab_overlay_spike --exclude fastab_term2 --color never -- -D warnings 2>&1 | tee target/clippy.log; then
            exit 0
          fi
          body="$(grep -E -A10 '^(error|warning)' target/clippy.log | head -200 | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }')"
          echo "::error title=clippy::${body}"
          exit 1

      # The engine's typed-hook provenance tests verify the checked-in
      # reference baselines against the compiled bundle/specs-ir pair, which is
      # gitignored. Compile it here exactly as build-app.sh does.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install JS dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Compile bundled spec IR for engine tests
        run: node scripts/compile-spec-ir.mjs

      - name: Enforce zero runtime JavaScript
        run: ./scripts/assert-no-runtime-js.sh

      # build-app.sh refuses a stale THIRD_PARTY_NOTICES.txt, but only on a
      # release tag. Check here so a dependency change fails on its own commit.
      - name: Check third-party notices
        run: |
          ./scripts/fetch-sparkle.sh >/dev/null
          node scripts/generate-third-party-notices.mjs --check

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          resource_log="$(mktemp)"
          trap 'rm -f "$resource_log"' EXIT
          status=0
          cargo test --workspace --locked --no-fail-fast --features fastab_cli/engine-cli --exclude fastab_desktop-fuzz --exclude fastab_overlay_spike --exclude fastab_term2 2>&1 | tee "$resource_log" || status=$?
          if [ "$status" -ne 0 ]; then
            # Logs need a GitHub login; annotations do not.
            python3 scripts/annotate-ci-failure.py cargo-test "$resource_log" || true
            exit "$status"
          fi
          # GPUI is not a workspace member. Its private ownership fixtures run
          # through fastab_gpui's test-support dependency, without needing a GPU.
          # Fail if feature/cfg drift silently removes a CPU-only regression.
          test "$(grep -Ec '^test resource_ownership_tests::.* \.\.\. ok$' "$resource_log")" -eq 21
          grep -Eq '^test resource_ownership_tests::native_menu_actions_retire_without_reusing_tags_or_disturbing_dock \.\.\. ok$' "$resource_log"
          grep -Eq '^test resource_ownership_tests::native_menu_action_owners_release_on_replacement_and_retirement \.\.\. ok$' "$resource_log"
          grep -Eq '^test resource_ownership_tests::empty_font_feature_array_has_no_abandoned_reference \.\.\. ok$' "$resource_log"
          grep -Eq '^test resource_ownership_tests::font_attributes_keep_values_alive_without_extra_array_references \.\.\. ok$' "$resource_log"
          grep -Eq '^test resource_ownership_tests::native_font_keeps_requested_features \.\.\. ok$' "$resource_log"
          grep -Eq '^test resource_ownership_tests::native_font_families_keep_only_selected_faces_loaded \.\.\. ok$' "$resource_log"
          grep -Eq '^test resource_ownership_tests::system_font_enumeration_stops_after_first_exact_match \.\.\. ok$' "$resource_log"
          grep -Eq '^test resource_ownership_tests::deferred_font_candidates_preserve_matching_and_fallback_precedence \.\.\. ok$' "$resource_log"
          grep -Eq '^test resource_ownership_tests::materialized_font_candidates_release_descriptors \.\.\. ok$' "$resource_log"
          grep -Eq '^test resource_ownership_tests::failed_font_family_load_keeps_registered_state_unchanged \.\.\. ok$' "$resource_log"
          grep -Eq '^test resource_ownership_tests::native_font_descriptors_keep_attributes_and_shaping \.\.\. ok$' "$resource_log"
          grep -Eq '^test resource_ownership_tests::native_fallback_keeps_candidate_precedence_and_font_ids \.\.\. ok$' "$resource_log"
          grep -Eq '^test resource_ownership_tests::generated_metal_shader_excludes_host_ffi \.\.\. ok$' "$resource_log"
          # Metal availability is not guaranteed on hosted runners. Compile and
          # collect the hardware fixtures; execute them separately on a GPU host.
          test "$(grep -Ec '^test resource_ownership_tests::metal_surface_cache_.* \.\.\. ignored' "$resource_log")" -eq 2

      - name: Replay completion resource lifecycle in one process
        run: cargo run --locked -p fastab_engine --example resource-replay -- --self-check

      # Thin LTO + codegen-units=1 is minutes on every PR and duplicates the
      # tag pipeline in release.yml. Keep the smoke on main so profile-specific
      # breakage (panic = "abort", LTO, strip) still lands before a tag.
      - name: Build release binaries (dist profile)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo build --locked --profile dist -p fastab_desktop -p fastab_term -p fastab_cli -p fastab_input_method

      # This is the shipped configuration (strip = "symbols", all four packages
      # in one build), so check here that it still leaves a dSYM per binary
      # for the release to attach, and that libmimalloc-sys (ftab's allocator)
      # still builds its C code as release: it defines NDEBUG only when its build
      # script sees DEBUG=false, which cc also reads to decide on `-g`, so debug
      # sections in libmimalloc.a mean the dist profile's line tables reached it.
      - name: Check dSYMs and the mimalloc release build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ./scripts/collect-dsyms.sh target/dist-dSYMs \
            target/dist/fastab target/dist/ftab target/dist/fterm target/dist/fastab_input_method
          libs=(target/dist/build/libmimalloc-sys-*/out/libmimalloc.a)
          if [ ! -f "${libs[0]}" ]; then
            echo "::error::the dist build left no libmimalloc.a" >&2
            exit 1
          fi
          lib="$(ls -t "${libs[@]}" | head -1)"
          if otool -l "$lib" | grep -q __debug_info; then
            echo "::error::${lib} has debug info: libmimalloc-sys saw DEBUG=true and built mimalloc without NDEBUG" >&2
            exit 1
          fi

      # One fterm stays resident per terminal tab. It binds nothing outside
      # libSystem; a framework link that comes back costs every tab its
      # initializers and data pages (crates/fastab_term/build.rs).
      - name: Verify fterm links only libSystem
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          links="$(otool -L target/dist/fterm | tail -n +2 | awk '{print $1}')"
          echo "$links"
          test "$links" = "/usr/lib/libSystem.B.dylib"

      # One fterm stays resident per terminal tab, so its footprint is tracked
      # on every main push. Job logs need a GitHub login; the annotation is
      # readable from the public API (escaping as in scripts/binary-size-report.sh).
      # A measurement, not a gate: a runner without `footprint` must not fail main.
      - name: Measure fterm footprint
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          for size in 40x120 60x240; do
            python3 scripts/fterm-footprint-ab.py --rounds 5 --size "$size" shipped=target/dist/fterm
          done | tee target/fterm-footprint.txt
          table="$(awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' target/fterm-footprint.txt)"
          echo "::notice title=fterm footprint::${table}"

      # Two latencies no test pins, published the same way: what `ftab init`
      # adds to every shell start, and the first completion after the engine
      # retired its caches (10 s after input ends) against a warm one.
      - name: Measure shell startup and cold completion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          python3 scripts/shell-startup-cost.py target/dist/ftab | tee target/shell-startup.txt
          table="$(awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' target/shell-startup.txt)"
          echo "::notice title=shell startup (ms)::${table}"
          cargo run --locked --profile dist -p fastab_engine --example cold-load -- bundle/specs-ir | tee target/cold-load.txt
          table="$(awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' target/cold-load.txt)"
          echo "::notice title=cold completion (ms)::${table}"

      # Which commit since v0.0.21 moved the engine's idle heap. The example is
      # copied into each older tree, which predates it; they share one worktree
      # and target directory, so each build only recompiles what changed.
      - name: Compare engine memory across commits
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p target/ab
          ab="$RUNNER_TEMP/engine-memory-ab"
          builds=()
          for entry in v0.0.21=c5f288a5d7ad760fd08786547ca0b5f8acd0b950 gen-spec=22ed7c702acdd68c154e4f001d2c511e468ed300 keep-specs=47d799d97b0b2cd0827f1fb9358a797d19ef9009 blocks=148075147b80924991271400edfb30ff28b9cb44 hash-threads=16bdae1f36e6d0bdb99d18f3138cd3ae93508b31 history-file=6083c6cf1dba16d2ada3c87e446ac3508556d63d; do
            name="${entry%%=*}"
            sha="${entry#*=}"
            git fetch --quiet --no-tags --depth=1 origin "$sha"
            if [ -d "$ab" ]; then
              git -C "$ab" checkout --quiet --detach "$sha"
            else
              git worktree add --quiet --detach "$ab" "$sha"
            fi
            cp crates/fastab_engine/examples/engine-memory.rs "$ab/crates/fastab_engine/examples/"
            (cd "$ab" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --locked --profile dist -p fastab_engine --example engine-memory)
            cp target/dist/examples/engine-memory "target/ab/$name"
            builds+=("$name=target/ab/$name")
          done
          cargo build --locked --profile dist -p fastab_engine --example engine-memory
          cp target/dist/examples/engine-memory target/ab/head
          builds+=("head=target/ab/head" "head-no-history=target/ab/head,no-history")
          python3 scripts/engine-memory-ab.py bundle/specs-ir "${builds[@]}" | tee target/engine-memory.txt
          table="$(awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' target/engine-memory.txt)"
          echo "::notice title=engine memory (KiB)::${table}"
