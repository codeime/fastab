[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/fastab_desktop/fuzz",
    "crates/macos-utils/accessibility-master/accessibility",
    "crates/macos-utils/accessibility-master/accessibility-sys",
    "crates/macos-utils/appkit-nsworkspace-bindings",
    "tests/fastab_term2",
]
default-members = ["crates/fastab_cli"]

[patch.crates-io]
gpui = { path = "vendor/gpui" }

[workspace.package]
authors = ["Fastab Contributors"]
edition = "2024"
homepage = "https://fastab.app/"
publish = false
version = "0.0.26-beta.1"
license = "MIT"

[workspace.dependencies]
anstream = "1.0.0"
anyhow = "1.0.98"
appkit-nsworkspace-bindings = { path = "crates/macos-utils/appkit-nsworkspace-bindings" }
assert_cmd = "2.0.17" # This version is required for musl builds to succeed
async-trait = "0.1.87"
base64 = "0.23.0"
block2 = "0.5.1"
bytes = "1.10.1"
bitflags = { version = "2.9.0", features = ["serde"] }
bstr = "1.12.0"
camino = { version = "1.1.3", features = ["serde1"] }
cfg-if = "1.0.0"
clap = { version = "4.5.32", features = [
    "deprecated",
    "derive",
    "string",
    "unicode",
    "wrap_help",
] }
chrono = { version = "0.4", features = ["serde"] }
cocoa = "0.26.0"
color-print = "0.3.5"
core-foundation = "0.10.0"
core-foundation-sys = "0.8.7"
core-graphics = "0.25.0"
crossterm = { version = "0.29.0", features = ["event-stream", "events"] }
dashmap = "6.0.1"
dirs = "5.0.0"
eyre = "0.6.8"
fastab_desktop_api = { path = "crates/fastab_desktop_api" }
fastab_telemetry = { path = "crates/fastab_telemetry" }
fastab_diagnostic = { path = "crates/fastab_diagnostic" }
fastab_install = { path = "crates/fastab_install" }
fastab_integrations = { path = "crates/fastab_integrations" }
fastab_ipc = { path = "crates/fastab_ipc" }
fastab_log = { path = "crates/fastab_log" }
fastab_os_shim = { path = "crates/fastab_os_shim" }
fastab_proto = { path = "crates/fastab_proto" }
fastab_remote_ipc = { path = "crates/fastab_remote_ipc" }
fastab_settings = { path = "crates/fastab_settings" }
fastab_test_utils = { path = "crates/fastab_test_utils" }
fastab_util = { path = "crates/fastab_util" }
flate2 = "1.1.1"
flume = "0.12.0"
futures = "0.3.26"
glob = "0.3.2"
globset = "0.4.16"
hex = "0.4.3"
http = "1.2.0"
indoc = "2.0.6"
insta = "1.43.1"
libc = "0.2.172"
mimalloc = "0.1.46"
nix = { version = "0.31.3", features = [
    "feature",
    "fs",
    "ioctl",
    "process",
    "signal",
    "term",
    "user",
] }
objc = "0.2.7"
objc2 = "0.5.2"
objc2-app-kit = "0.2.2"
objc2-foundation = "0.2.2"
objc2-input-method-kit = "0.2.2"
once_cell = "1.19.0"
parking_lot = "0.12.3"
percent-encoding = "2.2.0"
portable-pty = "0.9.0"
r2d2 = "0.8.10"
r2d2_sqlite = "0.25.0"
rand = "0.10.2"
regex = "1.7.0"
reqwest = { version = "0.12.14", default-features = false, features = [
    # defaults except tls and http2: telemetry, downloads and the AI client
    # all work over HTTP/1.1, and h2 was ~360 KB of every binary using this.
    "charset",
    # tls backend
    "rustls-tls",
    "rustls-tls-native-roots",
    # other features
    "gzip",
    "json",
    "socks",
    "cookies",
] }
ring = "0.17.14"
rusqlite = { version = "0.32.1", features = ["bundled", "serde_json"] }
shellexpand = "3.0.0"
shell-color = "1.0.0"
semver = { version = "1.0.26", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive", "rc"] }
# `preserve_order` is not optional here. gpui turns it on, so `fastab`
# already iterates `serde_json::Map` in insertion order — the order the Fig
# hooks' `Object.keys` saw. Without it, `cargo test -p fastab_engine` and a
# standalone `cargo build -p fastab_cli` get a `BTreeMap` and sort the same keys,
# so the native adapters would rank `npm view` versions and package.json
# scripts differently from the app the tests are meant to stand in for.
serde_json = { version = "1.0.140", features = ["preserve_order", "raw_value"] }
sha2 = "0.11.0"
shlex = "2.0.1"
similar = "2.7.0"
spinners = "4.1.0"
strum = { version = "0.28.0", features = ["derive"] }
sysinfo = "0.36.1"
thiserror = "2.0.12"
tempfile = "3.18.0"
time = { version = "0.3.39", features = [
    "parsing",
    "formatting",
    "local-offset",
    "macros",
    "serde",
] }
tokio = { version = "1.47.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.16", features = ["codec", "compat"] }
toml = "1.1.0"
tracing = { version = "0.1.40", features = ["log"] }
tracing-subscriber = { version = "0.3.19", features = [
    "env-filter",
    "fmt",
    "parking_lot",
    "time",
] }
unicode-width = "0.2.0"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.15.1", features = ["v4", "serde"] }
walkdir = "2.5.0"
which = "8.0.5"
whoami = "2.1.0"
winnow = "0.6.2"

# Keep these minor synced with reqwest
# https://github.com/seanmonstar/reqwest/blob/v0.12.12/Cargo.toml
rustls = "0.23.23"
rustls-native-certs = "0.8.1"
webpki-roots = "=0.26.8"


[workspace.lints.rust]
future_incompatible = "warn"
# Set by fastab_input_method's build script for the build_identity leaf it
# includes by #[path]; fastab_util compiles the same file without it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(build_identity_from_bundle)"] }
nonstandard_style = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
await_holding_lock = "warn"
char_lit_as_u8 = "warn"
checked_conversions = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
# doc_markdown = "warn"
empty_enum = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
from_iter_instead_of_collect = "warn"
if_let_mutex = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
let_unit_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"
# match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
missing_enforced_import_renames = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
string_to_string = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
useless_transmute = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
uninlined_format_args = "allow"

# Tuned for fast local iteration (`cargo build --release`, `cargo run --release`).
[profile.release]
debug = 1
incremental = true
lto = "off"

# Distribution profile used by scripts/build-app.sh and the release CI job.
# Optimizes for binary size and runtime over compile speed. `panic = "abort"`
# is safe here: no crate uses catch_unwind or a panic hook, and fuzz/tests run
# under their own profiles.
[profile.dist]
inherits = "release"
# Line tables go to a dSYM beside each binary (rustc runs dsymutil before it
# strips), so the shipped binaries stay stripped while a release's dSYMs can
# name the Rust frames in crash reports and malloc stack logs.
debug = "line-tables-only"
split-debuginfo = "packed"
incremental = false
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# libmimalloc-sys defines NDEBUG and MI_BUILD_RELEASE for its C code only when
# Cargo hands its build script DEBUG=false, and DEBUG follows this package's
# debuginfo. Keep it off so dist's line tables do not turn ftab's allocator
# into a non-release C build.
[profile.dist.package.libmimalloc-sys]
debug = false

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

[profile.dev.package.backtrace]
opt-level = 3
